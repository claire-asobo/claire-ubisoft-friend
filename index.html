<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffe6f1"><title>くれあとあそぼ♡ | Ubisoft Connect フレンド申請</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#fff 0,#ffe6f1 50%,#f9d7ef 100%);color:#70455f}.card{width:min(100%,470px);padding:34px 25px;background:#ffffffd9;border:2px solid white;border-radius:30px;box-shadow:0 18px 50px #ba72914d;text-align:center}.heart{font-size:38px}h1{font-size:26px;color:#d94e94;margin:12px 0}p{line-height:1.85}.sub{font-size:14px}.id{padding:18px 8px;background:#fff2f8;border:2px dashed #efa6c9;border-radius:16px;font-size:24px;font-weight:800;letter-spacing:.3px;color:#a32b72;margin:20px 0}button,a.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 12px;margin:12px 0;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}button{background:#fff;border:2px solid #ed85b4;color:#c63c86}a.btn{background:linear-gradient(100deg,#f47eb1,#d95099);color:white;box-shadow:0 6px 16px #e18bb75c}.steps{text-align:left;background:#fff7fb;border-radius:16px;padding:15px 20px;font-size:14px}.note{font-size:12px;color:#8c7080}#status{min-height:24px;color:#b5337e;font-weight:700}</style></head><body><main class="card"><div class="heart">🎀 💕 🎮</div><h1>くれあとあそぼ♡</h1><p>Ubisoft Connectでフレンド募集中♪<br>一緒にゲームを楽しみましょうっ✨</p><p class="sub">🌸 Ubisoft Connect ID 🌸</p><div class="id" id="userid">claire03_twitch</div><button id="copy" type="button">📋 IDをコピーする</button><div id="status" role="status" aria-live="polite"></div><a class="btn" href="https://www.ubisoft.com/" target="_blank" rel="noopener noreferrer">💗 フレンド申請へ進む ↗</a><div class="steps"><strong>申請のしかた ♡</strong><p>① 上のボタンでIDをコピー<br>② Ubisoft公式サイトでログイン<br>③ フレンド一覧 →「フレンド追加」<br>④ IDを貼り付けて検索<br>⑤ <strong>claire03_twitch</strong> を選んで申請💕</p></div><p class="note">※ 申請はUbisoft公式サイトで行います。<br>このページから申請を自動送信することはできません。</p></main><script>document.getElementById('copy').addEventListener('click',async()=>{const id='claire03_twitch',status=document.getElementById('status');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(id)}else{const t=document.createElement('textarea');t.value=id;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}status.textContent='💕 IDをコピーしました！'}catch(e){status.textContent='IDを長押ししてコピーしてください♪'}})</script></body></html>
